[tool.poetry]
name = "slides-figure-service"
version = "0.1.0"
description = "Microservice to extract figure images from slide images via HTTP API"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "slidefigs", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.117.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
pillow = "^10.4.0"
numpy = "^1.26.0"
python-multipart = "^0.0.9"
layoutparser = "^0.3.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"
ruff = "^0.13.0"
mypy = "^1.18.0"

[tool.poetry.scripts]
slidefigs-api = "slidefigs.service:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
]
