openapi: 3.0.3
info:
  title: Service Video-Generation APIs
  version: "0.3"

paths:
  /v1/avatars:
    post:
      tags: [avatar]
      summary: Create Avatar
      operationId: create_avatar_v1_avatars_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_avatar_v1_avatars_post'
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarCreatedResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /v1/avatars/by-course/{courseId}:
    get:
      tags: [avatar]
      summary: Get Avatars By Course Endpoint
      operationId: get_avatars_by_course_endpoint_v1_avatars_by_course__courseId__get
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Courseid
        - name: slot
          in: query
          required: false
          description: "optional: default | beginning | ending"
          schema:
            anyOf:
              - type: string
              - type: null
            description: "optional: default | beginning | ending"
            title: Slot
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Avatars By Course Endpoint V1 Avatars By Course  Courseid  Get
                type: array
                items:
                  $ref: '#/components/schemas/AvatarCreatedResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /v1/avatars/{courseId}/{slot}/image:
    post:
      tags: [avatar]
      summary: Replace Avatar Image Endpoint
      operationId: replace_avatar_image_endpoint_v1_avatars__courseId___slot__image_post
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Courseid
        - name: slot
          in: path
          required: true
          schema:
            type: string
            title: Slot
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_replace_avatar_image_endpoint_v1_avatars__courseId___slot__image_post'
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarCreatedResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /v1/avatars/{courseId}/{slot}/audio:
    post:
      tags: [avatar]
      summary: Replace Avatar Audio Endpoint
      operationId: replace_avatar_audio_endpoint_v1_avatars__courseId___slot__audio_post
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Courseid
        - name: slot
          in: path
          required: true
          schema:
            type: string
            title: Slot
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_replace_avatar_audio_endpoint_v1_avatars__courseId___slot__audio_post'
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarCreatedResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /v1/video/generate:
    post:
      tags: [video]
      summary: Request Video Generation
      description: |
        Nimmt einen einzelnen Slide entgegen (payload.voiceTrack),
        erwartet eine explizite Slide-Nummer (payload.slideNumber) und enqueued die Aufgabe.
      operationId: request_video_generation_v1_video_generate_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        "202":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationAcceptedResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /v1/video/{promptId}/status:
    get:
      tags: [video]
      summary: Get Generation Status
      operationId: get_generation_status_v1_video__promptId__status_get
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Promptid
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatusResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

components:
  schemas:
    AvatarAudioResponse:
      title: AvatarAudioResponse
      type: object
      required: [id, avatarId, filePath, createdAt]
      properties:
        id:
          title: Id
          type: string
          format: uuid
        avatarId:
          title: Avatarid
          type: string
          format: uuid
        filePath:
          title: Filepath
          type: string
        mimeType:
          title: Mimetype
          anyOf:
            - type: string
            - type: null
        sizeBytes:
          title: Sizebytes
          anyOf:
            - type: integer
            - type: null
        createdAt:
          title: Createdat
          type: string
          format: date-time

    AvatarCreatedResponse:
      title: AvatarCreatedResponse
      type: object
      required: [avatarId, createdAt, image, audio]
      properties:
        avatarId:
          title: Avatarid
          type: string
          format: uuid
        name:
          title: Name
          anyOf:
            - type: string
            - type: null
        courseId:
          title: Courseid
          anyOf:
            - type: string
              format: uuid
            - type: null
        slot:
          $ref: '#/components/schemas/CourseAvatarSlot'
          default: default
        createdAt:
          title: Createdat
          type: string
          format: date-time
        image:
          $ref: '#/components/schemas/AvatarImageResponse'
        audio:
          $ref: '#/components/schemas/AvatarAudioResponse'

    AvatarImageResponse:
      title: AvatarImageResponse
      type: object
      required: [id, avatarId, filePath, createdAt]
      properties:
        id:
          title: Id
          type: string
          format: uuid
        avatarId:
          title: Avatarid
          type: string
          format: uuid
        filePath:
          title: Filepath
          type: string
        mimeType:
          title: Mimetype
          anyOf:
            - type: string
            - type: null
        sizeBytes:
          title: Sizebytes
          anyOf:
            - type: integer
            - type: null
        createdAt:
          title: Createdat
          type: string
          format: date-time

    Body_create_avatar_v1_avatars_post:
      title: Body_create_avatar_v1_avatars_post
      type: object
      required: [courseId, image_file, audio_file]
      properties:
        name:
          title: Name
          anyOf:
            - type: string
            - type: null
        courseId:
          title: Courseid
          type: string
          format: uuid
        slot:
          title: Slot
          default: default
          anyOf:
            - type: string
            - type: null
        image_file:
          title: Image File
          description: png/jpeg/webp
          type: string
          format: binary
        audio_file:
          title: Audio File
          description: mp3/wav/flac/webm
          type: string
          format: binary

    Body_replace_avatar_audio_endpoint_v1_avatars__courseId___slot__audio_post:
      title: Body_replace_avatar_audio_endpoint_v1_avatars__courseId___slot__audio_post
      type: object
      required: [audio_file]
      properties:
        audio_file:
          title: Audio File
          description: mp3/wav/flac/webm
          type: string
          format: binary

    Body_replace_avatar_image_endpoint_v1_avatars__courseId___slot__image_post:
      title: Body_replace_avatar_image_endpoint_v1_avatars__courseId___slot__image_post
      type: object
      required: [image_file]
      properties:
        image_file:
          title: Image File
          description: png/jpeg/webp
          type: string
          format: binary

    CourseAvatarSlot:
      title: CourseAvatarSlot
      type: string
      enum: [default, beginning, ending]

    ErrorModel:
      title: ErrorModel
      type: object
      properties:
        code:
          title: Code
          anyOf:
            - type: string
            - type: null
        message:
          title: Message
          anyOf:
            - type: string
            - type: null

    GenerateRequest:
      title: GenerateRequest
      type: object
      required: [voiceTrack, slideNumber, promptId, courseId, userProfile]
      properties:
        voiceTrack:
          title: Voicetrack
          type: string
          minLength: 1
        slideNumber:
          title: Slidenumber
          type: integer
          minimum: 0.0
        promptId:
          title: Promptid
          type: string
          format: uuid
        courseId:
          title: Courseid
          type: string
        userProfile:
          $ref: '#/components/schemas/UserProfile'
        slot:
          title: Slot
          type: string
          enum: [default, beginning, ending]
          default: default

    GenerationAcceptedResponse:
      title: GenerationAcceptedResponse
      type: object
      required: [promptId, createdAt]
      properties:
        promptId:
          title: Promptid
          type: string
          format: uuid
        createdAt:
          title: Createdat
          type: string
          format: date-time

    GenerationStatusResponse:
      title: GenerationStatusResponse
      type: object
      required: [promptId, status, lastUpdated, resultUrl, estimatedSecondsLeft]
      properties:
        promptId:
          title: Promptid
          type: string
          format: uuid
        status:
          title: Status
          type: string
          enum: [IN_PROGRESS, FAILED, DONE]
        lastUpdated:
          title: Lastupdated
          type: string
          format: date-time
        resultUrl:
          title: Resulturl
          type: string
        estimatedSecondsLeft:
          title: Estimatedsecondsleft
          type: integer
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorModel'
            - type: null

    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    Preferences:
      title: Preferences
      type: object
      properties:
        answerLength:
          title: Answerlength
          anyOf:
            - type: string
              enum: [short, medium, long]
            - type: null
        languageLevel:
          title: Languagelevel
          anyOf:
            - type: string
              enum: [basic, intermediate, advanced]
            - type: null
        expertiseLevel:
          title: Expertiselevel
          anyOf:
            - type: string
              enum: [beginner, intermediate, advanced, expert]
            - type: null
        includePictures:
          title: Includepictures
          anyOf:
            - type: string
              enum: [none, few, many]
            - type: null

    UserProfile:
      title: UserProfile
      type: object
      required: [id, role, language]
      properties:
        id:
          title: Id
          type: string
        role:
          title: Role
          type: string
          enum: [student, instructor]
        language:
          title: Language
          type: string
          enum: [german, english]
        preferences:
          anyOf:
            - $ref: '#/components/schemas/Preferences'
            - type: null
        enrolled_courses:
          title: Enrolled Courses
          anyOf:
            - type: array
              items:
                type: string
            - type: null

    ValidationError:
      title: ValidationError
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string