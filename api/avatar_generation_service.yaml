openapi: "3.1.0"
info:
  title: Service Video-Generation APIs
  version: "0.1"
paths:
  /v1/avatars:
    post:
      tags:
        - avatar
      summary: Create Avatar
      operationId: create_avatar_v1_avatars_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_avatar_v1_avatars_post'
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarCreatedResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/avatars/by-course/{courseId}:
    get:
      tags:
        - avatar
      summary: Get Avatars By Course Endpoint
      operationId: get_avatars_by_course_endpoint_v1_avatars_by_course__courseId__get
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            title: Courseid
        - name: slot
          in: query
          required: false
          description: optional: default | beginning | ending
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Slot
            description: optional: default | beginning | ending
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                title: Response Get Avatars By Course Endpoint V1 Avatars By Course  Courseid  Get
                items:
                  $ref: '#/components/schemas/AvatarCreatedResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/avatars/{courseId}/{slot}/image:
    post:
      tags:
        - avatar
      summary: Replace Avatar Image Endpoint
      operationId: replace_avatar_image_endpoint_v1_avatars__courseId___slot__image_post
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            title: Courseid
        - name: slot
          in: path
          required: true
          schema:
            type: string
            title: Slot
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_replace_avatar_image_endpoint_v1_avatars__courseId___slot__image_post'
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarCreatedResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/avatars/{courseId}/{slot}/audio:
    post:
      tags:
        - avatar
      summary: Replace Avatar Audio Endpoint
      operationId: replace_avatar_audio_endpoint_v1_avatars__courseId___slot__audio_post
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            title: Courseid
        - name: slot
          in: path
          required: true
          schema:
            type: string
            title: Slot
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_replace_avatar_audio_endpoint_v1_avatars__courseId___slot__audio_post'
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarCreatedResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/video/generate:
    post:
      tags:
        - video
      summary: Request Video Generation
      description: |-
        Nimmt einen einzelnen Slide entgegen (payload.voiceTrack),
        erwartet eine explizite Slide-Nummer (payload.slideNumber) und enqueued die Aufgabe.
      operationId: request_video_generation_v1_video_generate_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        "202":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationAcceptedResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/video/{promptId}/status:
    get:
      tags:
        - video
      summary: Get Generation Status
      operationId: get_generation_status_v1_video__promptId__status_get
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Promptid
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatusResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AvatarAudioResponse:
      title: AvatarAudioResponse
      type: object
      required:
        - id
        - avatarId
        - filePath
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          title: Id
        avatarId:
          type: string
          format: uuid
          title: Avatarid
        filePath:
          type: string
          title: Filepath
        mimeType:
          anyOf:
            - type: string
            - type: "null"
          title: Mimetype
        sizeBytes:
          anyOf:
            - type: integer
            - type: "null"
          title: Sizebytes
        createdAt:
          type: string
          format: date-time
          title: Createdat
    AvatarCreatedResponse:
      title: AvatarCreatedResponse
      type: object
      required:
        - avatarId
        - createdAt
      properties:
        avatarId:
          type: string
          format: uuid
          title: Avatarid
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
        courseId:
          anyOf:
            - type: string
            - type: "null"
          title: Courseid
        slot:
          $ref: '#/components/schemas/CourseAvatarSlot'
          default: default
        createdAt:
          type: string
          format: date-time
          title: Createdat
        image:
          anyOf:
            - $ref: '#/components/schemas/AvatarImageResponse'
            - type: "null"
        audio:
          anyOf:
            - $ref: '#/components/schemas/AvatarAudioResponse'
            - type: "null"
    AvatarImageResponse:
      title: AvatarImageResponse
      type: object
      required:
        - id
        - avatarId
        - filePath
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          title: Id
        avatarId:
          type: string
          format: uuid
          title: Avatarid
        filePath:
          type: string
          title: Filepath
        mimeType:
          anyOf:
            - type: string
            - type: "null"
          title: Mimetype
        sizeBytes:
          anyOf:
            - type: integer
            - type: "null"
          title: Sizebytes
        createdAt:
          type: string
          format: date-time
          title: Createdat
    Body_create_avatar_v1_avatars_post:
      title: Body_create_avatar_v1_avatars_post
      type: object
      required:
        - courseId
        - image_file
        - audio_file
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
        courseId:
          type: string
          title: Courseid
        slot:
          anyOf:
            - type: string
            - type: "null"
          title: Slot
          default: default
        image_file:
          type: string
          format: binary
          title: Image File
          description: png/jpeg/webp
        audio_file:
          type: string
          format: binary
          title: Audio File
          description: mp3/wav/flac/webm
    Body_replace_avatar_audio_endpoint_v1_avatars__courseId___slot__audio_post:
      title: Body_replace_avatar_audio_endpoint_v1_avatars__courseId___slot__audio_post
      type: object
      required:
        - audio_file
      properties:
        audio_file:
          type: string
          format: binary
          title: Audio File
          description: mp3/wav/flac/webm
    Body_replace_avatar_image_endpoint_v1_avatars__courseId___slot__image_post:
      title: Body_replace_avatar_image_endpoint_v1_avatars__courseId___slot__image_post
      type: object
      required:
        - image_file
      properties:
        image_file:
          type: string
          format: binary
          title: Image File
          description: png/jpeg/webp
    CourseAvatarSlot:
      title: CourseAvatarSlot
      type: string
      enum:
        - default
        - beginning
        - ending
    ErrorModel:
      title: ErrorModel
      type: object
      properties:
        code:
          anyOf:
            - type: string
            - type: "null"
          title: Code
        message:
          anyOf:
            - type: string
            - type: "null"
          title: Message
    GenerateRequest:
      title: GenerateRequest
      type: object
      required:
        - voiceTrack
        - slideNumber
        - promptId
        - courseId
        - userProfile
      properties:
        voiceTrack:
          type: string
          minLength: 1
          title: Voicetrack
        slideNumber:
          type: integer
          minimum: 0.0
          title: Slidenumber
        promptId:
          type: string
          format: uuid
          title: Promptid
        courseId:
          type: string
          title: Courseid
        userProfile:
          $ref: '#/components/schemas/UserProfile'
        slot:
          type: string
          enum:
            - default
            - beginning
            - ending
          title: Slot
          default: default
    GenerationAcceptedResponse:
      title: GenerationAcceptedResponse
      type: object
      required:
        - promptId
        - createdAt
      properties:
        promptId:
          type: string
          format: uuid
          title: Promptid
        createdAt:
          type: string
          format: date-time
          title: Createdat
    GenerationStatusResponse:
      title: GenerationStatusResponse
      type: object
      required:
        - promptId
        - status
        - lastUpdated
        - resultUrl
        - estimatedSecondsLeft
      properties:
        promptId:
          type: string
          format: uuid
          title: Promptid
        status:
          type: string
          enum:
            - IN_PROGRESS
            - FAILED
            - DONE
          title: Status
        lastUpdated:
          type: string
          format: date-time
          title: Lastupdated
        resultUrl:
          type: string
          title: Resulturl
        estimatedSecondsLeft:
          type: integer
          title: Estimatedsecondsleft
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorModel'
            - type: "null"
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          type: array
          title: Detail
          items:
            $ref: '#/components/schemas/ValidationError'
    Preferences:
      title: Preferences
      type: object
      properties:
        answerLength:
          anyOf:
            - type: string
              enum: [short, medium, long]
            - type: "null"
          title: Answerlength
        languageLevel:
          anyOf:
            - type: string
              enum: [basic, intermediate, advanced]
            - type: "null"
          title: Languagelevel
        expertiseLevel:
          anyOf:
            - type: string
              enum: [beginner, intermediate, advanced, expert]
            - type: "null"
          title: Expertiselevel
        includePictures:
          anyOf:
            - type: string
              enum: [none, few, many]
            - type: "null"
          title: Includepictures
    UserProfile:
      title: UserProfile
      type: object
      required:
        - id
        - role
        - language
      properties:
        id:
          type: string
          title: Id
        role:
          type: string
          enum: [student, instructor]
          title: Role
        language:
          type: string
          enum: [german, english]
          title: Language
        preferences:
          anyOf:
            - $ref: '#/components/schemas/Preferences'
            - type: "null"
        enrolled_courses:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
          title: Enrolled Courses
    ValidationError:
      title: ValidationError
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          title: Location
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type